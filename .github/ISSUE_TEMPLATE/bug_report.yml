name: 버그 신고 / Bug report
description: 패널이 잘못 넘어가거나, 보스·보상·기록이 안 맞을 때 / Wrong step, missed boss, reward or split
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        고마워요! 아래를 채워 주면 로그로 바로 재현할 수 있습니다.
        Thanks! With the details below the problem can usually be reproduced from the log.
  - type: input
    id: version
    attributes:
      label: 버전 / Version
      description: 우클릭 → 업데이트 메뉴에 나오는 현재 버전 / Shown under Right-click → Updates
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 게임 클라이언트 / Game client
      options:
        - 카카오게임즈 (한국 서버) / Kakao Games (Korea)
        - Steam
        - GGG 독립 실행판 / GGG standalone
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: 게임 언어 / Game language
      options:
        - 한국어 / Korean
        - English
        - 기타 / Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 지역·보스 이름, 대략의 시각(로그 시각과 맞춰 보기 위해) / Area or boss name and roughly when it happened
      placeholder: |
        예) 붉은 계곡에서 녹왕과 싸우는데 패널이 한 줄로 줄지 않음 (21:03 무렵)
        e.g. Fighting The Rust King in The Red Vale, the panel did not shrink (around 21:03)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작 / What did you expect?
  - type: textarea
    id: log
    attributes:
      label: 로그 줄 / Log lines
      description: |
        그 시각 앞뒤의 로그 줄을 붙여 주세요. 카카오판 `C:\Daum Games\Path of Exile2\logs\KakaoClient.txt`, Steam/GGG판 `…\Path of Exile 2\logs\Client.txt`.
        **`#`·`@`·`$`·`%`·`&` 로 시작하는 채팅·귓속말 줄은 지워 주세요** (다른 사람 이름이 들어 있습니다).
        Paste the log lines around that time. **Remove chat and whisper lines (starting with `#`, `@`, `$`, `%`, `&`)** — they contain other players' names.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 / Screenshot
      description: 패널이 보이는 화면이면 도움이 됩니다 (캐릭터·계정 이름은 가려도 됩니다) / A screenshot of the panel helps (feel free to hide names)
