# 소개 사이트(site/)를 GitHub Pages 로 배포. 이미지는 README 와 같은 docs/images 를 그대로 복사해 쓴다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔 둬야 한다.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp -r docs/images site/images
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
